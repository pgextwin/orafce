name: Windows CI/CD
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Formal publication by release/* is retired; only an independently gated,
# operator-confirmed main-only promotion can become a future publisher.
jobs:
  windows:
    permissions:
      contents: read
    uses: pgextwin/build/.github/workflows/build-extension.yml@43993b864e59bd35870e15c410ac13c85def8531
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json

  candidate_report:
    name: Verify candidate Windows matrix and immutable artifacts
    if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/auto-candidate/') }}
    needs: windows
    permissions:
      contents: read
      actions: read
      issues: write
    uses: pgextwin/build/.github/workflows/verify-candidate.yml@ecf84241c1c4cd99fab3f964cb309f9c6e2a01f8
    with:
      matrix_result: ${{ needs.windows.result }}
