name: Windows technical pilot
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wave3-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    uses: pgextwin/build/.github/workflows/build-extension.yml@8aed6b564514af10d97f846333ced00925642845
    with:
      extension_config_path: config/extension.json
      test_contract_path: config/test-contract.json
