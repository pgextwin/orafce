name: Issue 311 R06 genuine local PREPARE original ZIP pilot (NONPUBLISHING)

# Dedicated protected local request push, NOT schedule or workflow_dispatch.
# The original source Run and archive are independently read and rehashed.
on:
  push:
    branches: [main]
    paths:
      - ".github/execution-requests/r-20261029-r06localpilot01.json"
  pull_request:
    paths:
      - ".github/workflows/issue311-local-prepare.yml"
      - "scripts/issue311-local-prepare.py"
      - "tests/test_issue311_local_prepare_policy.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: issue311-local-prepare-pilot-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy_test:
    if: github.event_name == 'pull_request'
    name: Reject local PREPARE writer, schedule and false-publishing paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python tests/test_issue311_local_prepare_policy.py

  local_prepare:
    name: Exact real protected orafce PREPARE source and original ZIP proof
    if: github.repository == 'pgextwin/orafce' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 05d78b6cb1eebfdb671aca382431fb0c89cf43e2
          path: .pgextwin-build
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Verify fresh original PREPARE ZIP and 17 registered source mains (NEVER WRITE)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-local-prepare.py run
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-local-prepare-original-zip-pilot
          path: issue311-r06-local-prepare-receipt.json
          if-no-files-found: error
          retention-days: 30
