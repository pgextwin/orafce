name: R11 operator source and existing candidate admission pilot (NONPUBLISHING)
# No schedule replacement, fake schedule, external timer, State Writer or signing token.
on:
  pull_request:
    paths:
      - ".github/workflows/issue311-r11-event-source.yml"
      - "scripts/issue311-r11-event-source.py"
      - "tests/test-issue311-r11-event-source.py"
      - "scripts/issue311-r11-candidate-adapter.py"
      - "tests/test-issue311-r11-candidate-adapter.py"
      - "scripts/issue311-r11-central-source.py"
      - "tests/test-issue311-r11-central-source.py"
      - "tests/test-issue311-r11-nonpublishing-functions.py"
  push:
    branches: [main]
    paths:
      - ".github/issue311-r11-intents/*.json"

permissions:
  contents: read
  actions: read

jobs:
  offline_negatives:
    name: R11 strict operator and existing candidate hostile tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python tests/test-issue311-r11-event-source.py
          python tests/test-issue311-r11-candidate-adapter.py
          python tests/test-issue311-r11-central-source.py
          python tests/test-issue311-r11-nonpublishing-functions.py

  source_observation:
    name: Authenticate protected operator push and historic candidate (NO SIGNING)
    if: github.repository == 'pgextwin/orafce' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate real protected push and exact immutable one-file intent
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r11-event-source.py
      - name: Checkout immutable central proven native candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 12e9c809d963c82735e23680ac1838693a6de356
          path: .pgextwin-build
          persist-credentials: false
      - name: Independently bind bot PR and App15368 native Windows original
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r11-candidate-adapter.py
      - name: Bind real historical central original fleet snapshot and candidate (NO SIGNING)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/issue311-r11-central-source.py
      - name: Preserve original authenticated source and candidate metadata (NONPUBLISHING)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue311-r11-operator-candidate-original
          path: |
            issue311-r11-source-admission.json
            issue311-r11-candidate-admission.json
            issue311-r11-central-original.json
          if-no-files-found: error
          retention-days: 30


  # Existing central Python code is executed on an immutable checkout.
  # Calling its legacy reusable workflows would request write scopes even
  # with dry_run, so this pilot runs only bounded read-only steps directly.
  operator_readonly_functions:
    name: Authenticated operator-only read-only watch, Issue check and candidate plan
    needs: source_observation
    if: ${{ needs.source_observation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: 19477b9440ce809fbadbd4fc0c7fadfd40a4a78f
          path: .pgextwin-build
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Source-bound read-only fleet watch admission
        id: watch_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .pgextwin-build/scripts/fleet-control.py
          --extension config/extension.json --watch config/update-watch.json
          --repository "$GITHUB_REPOSITORY" --action watch
      - name: Verify watch schema and upstream candidate (GET ONLY)
        if: steps.watch_gate.outputs.allowed == 'true'
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "jsonschema>=4,<5"
          python .pgextwin-build/scripts/validate-update-watch.py \
            --extension-config config/extension.json --watch-config config/update-watch.json \
            --schema .pgextwin-build/schema/update-watch.schema.json
          python .pgextwin-build/scripts/check-upstream-update.py \
            --extension-config config/extension.json --watch-config config/update-watch.json \
            --output "$RUNNER_TEMP/update-result.json" \
            --watcher-repository pgextwin/build \
            --watcher-sha 19477b9440ce809fbadbd4fc0c7fadfd40a4a78f
      - name: Dry-run Issue reconciliation (no write scope)
        if: steps.detect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .pgextwin-build/scripts/reconcile-update-issue.py \
            --result "$RUNNER_TEMP/update-result.json" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/reconcile-result.json" --dry-run
      - name: Read-only candidate policy authorization
        id: candidate_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .pgextwin-build/scripts/fleet-control.py
          --extension config/extension.json --watch config/update-watch.json
          --repository "$GITHUB_REPOSITORY" --action candidate
          --candidate-policy config/candidate-build.json
      - name: Compute immutable candidate plan, NEVER invoke propose
        if: steps.candidate_gate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .pgextwin-build/scripts/candidate-update.py plan
          --extension config/extension.json
          --watch config/update-watch.json
          --policy config/candidate-build.json
          --lifecycle .pgextwin-build/metadata/postgresql.json
          --output "$RUNNER_TEMP/candidate-plan.json"
      - name: Store only read-only decision receipts
        if: always() && needs.source_observation.result == 'success'
        run: |
          python - <<'PY'
          import os,json,pathlib,shutil
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          dst=pathlib.Path("r11-functional-readonly-receipts")
          dst.mkdir(exist_ok=True)
          for name in ("update-result.json","reconcile-result.json","candidate-plan.json"):
              src=root/name
              if src.is_file():
                  shutil.copyfile(src,dst/name)
          (dst/"mode.json").write_text(json.dumps({
              "mode":"NONPUBLISHING_READONLY",
              "originalRun":int(os.environ["GITHUB_RUN_ID"]),
              "originalHead":os.environ["GITHUB_SHA"],
              "publicationAuthorized":False,
              "writerCalled":False},sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.source_observation.result == 'success'
        with:
          name: r11-operator-functions-readonly-original
          path: r11-functional-readonly-receipts/
          if-no-files-found: error
          retention-days: 30
